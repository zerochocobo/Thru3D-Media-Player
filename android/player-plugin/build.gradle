plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def ncnnRoot = providers.gradleProperty('ncnnDir').orElse(providers.environmentVariable('QUEST_NCNN_ROOT'))
if (!ncnnRoot.isPresent()) { throw new GradleException('Pass -PncnnDir=<ncnn arm64 root> or activate the Quest environment.') }
def mnnSource = providers.gradleProperty('mnnSource').orElse(providers.environmentVariable('QUEST_MNN_SOURCE'))
def mnnLib = providers.gradleProperty('mnnLib').orElse(providers.environmentVariable('QUEST_MNN_LIB'))
if (!mnnSource.isPresent() || !mnnLib.isPresent()) { throw new GradleException('Activate the Quest environment (QUEST_MNN_SOURCE/QUEST_MNN_LIB).') }

// Keep the full numerical oracles on disk for device diagnostics, but never
// include them in a normal player APK (including ordinary Debug builds).
def includeDiagnostics = providers.gradleProperty('includeDiagnostics').map { it.toBoolean() }.getOrElse(false)
// Subtitle narration is included in both normal Debug and Release builds.
def narrationManifest = new groovy.json.JsonSlurper().parse(file('../../third_party/narration/model.json'))
def cloneManifest = new groovy.json.JsonSlurper().parse(file('../../third_party/narration/clone_model.json'))
def vadManifest = new groovy.json.JsonSlurper().parse(file('../../third_party/narration/vad_model.json'))
def comicManifest = new groovy.json.JsonSlurper().parse(file('../../third_party/comic-ocr/model.json'))
def narrationBundles = [narrationManifest, cloneManifest, vadManifest]
def assetBundles = narrationBundles.collect { [bundle: it, root: "../../models/narration/${it.id}"] } + [[bundle: comicManifest, root: "../../models/comic-ocr/${comicManifest.id}"]]
def listeningManifest = new groovy.json.JsonSlurper().parse(file('../../third_party/moonshine/model.json'))
listeningManifest.models.each { language, bundle -> assetBundles += [[bundle: bundle, root: "../../models/listening/${language}"]] }
def narrationModels = file("../../models/narration/${narrationManifest.id}")
def playerAssets = layout.buildDirectory.dir('playerAssets')
def validateLicenseCatalog = tasks.register('validateLicenseCatalog') {
    doLast {
        // Every About row must resolve to readable packaged text, including
        // newly added dependencies. Engine notices use Godot's runtime API.
        def catalog = new groovy.json.JsonSlurper().parse(file('../../app/godot/i18n/licenses.json'))
        def licenseIds = new HashSet<String>()
        catalog.each { entry ->
            if (!entry.id || !entry.name || !entry.license || !licenseIds.add(entry.id as String) ||
                    !(entry.assets instanceof List) ||
                    (entry.assets.isEmpty() && !(entry.id in ['godot', 'godot-third-party']))) {
                throw new GradleException("Invalid About license entry: ${entry.id}")
            }
            entry.assets.each { path ->
                if (!(path instanceof String) || path.startsWith('/') || path.contains('..') || path.contains(':') || path.contains('\\')) {
                    throw new GradleException("Invalid About license path: ${entry.id}")
                }
                def notice = file("../../third_party/${path}")
                if (!notice.isFile() || notice.length() == 0 || notice.length() > 256 * 1024) {
                    throw new GradleException("Missing or unreadable About license: ${path}")
                }
            }
        }
    }
}

def stagePlayerAssets = tasks.register('stagePlayerAssets', Sync) {
    dependsOn validateLicenseCatalog
    from('src/main/assets')
    from('../../third_party')
    exclude 'tiff/*.tar.xz', 'tiff/*.tar.gz'
    exclude 'openexr/*.tar.gz'
    exclude 'image/*.tar.gz'
    from('../../app/godot/i18n')
    from('../../build/web-video') { include 'yt-dlp.zip'; into 'web-video' }
    into(playerAssets)
    assetBundles.each { entry ->
        def bundle = entry.bundle
        from(file(entry.root)) {
            into(bundle.directory)
            include(bundle.files.keySet() as String[])
        }
    }
    doFirst {
        def webRuntime = new groovy.json.JsonSlurper().parse(file('../../third_party/web-video/runtime.json'))
        def extractor = file('../../build/web-video/yt-dlp.zip')
        if (!extractor.isFile() || extractor.length() != webRuntime.bytes ||
                java.security.MessageDigest.getInstance('SHA-256').digest(extractor.bytes).encodeHex().toString() != webRuntime.sha256) {
            throw new GradleException('Missing or damaged web video runtime. Run tools/environment/Prepare-WebVideo.ps1.')
        }
        assetBundles.each { entry -> entry.bundle.files.each { name, expected ->
            def model = new File(file(entry.root), name)
            if (!model.isFile() || model.length() != expected.bytes) {
                throw new GradleException("Missing model: ${model}. Restore the pinned model files before building.")
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            model.withInputStream { input ->
                byte[] buffer = new byte[131072]
                int count
                while ((count = input.read(buffer)) > 0) { digest.update(buffer, 0, count) }
            }
            if (digest.digest().encodeHex().toString() != expected.sha256) {
                throw new GradleException("Model digest differs: ${name}")
            }
        } }
    }
    if (!includeDiagnostics) {
        exclude 'rvm/reference/**', 'rvm/**/*.bin', 'rvm/**/*.param', 'rvm-mnn/rvm_quality.mnn'
    }
}

android {
    namespace 'org.vrpassthroughplayer.plugin'
    compileSdkVersion 'android-37.2'
    buildToolsVersion '36.1.0'
    ndkVersion '29.0.14206865'
    buildFeatures { buildConfig true }
    sourceSets.main.assets.setSrcDirs([playerAssets])
    defaultConfig {
        minSdk 29
        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField 'boolean', 'INCLUDE_DIAGNOSTIC_MODELS', includeDiagnostics.toString()
        buildConfigField 'boolean', 'NARRATION_ENABLED', 'true'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                // Normal playback includes offline subtitle narration.
                targets 'quest_rvm', 'quest_render_bridge', 'quest_mpv', 'quest_video_layer', 'quest_usb', 'quest_narration', 'quest_listening', 'quest_tiff', 'quest_hdr', 'quest_image'
                arguments "-Dncnn_DIR=${ncnnRoot.get().replace('\\', '/')}/lib/cmake/ncnn", '-DANDROID_STL=c++_shared',
                '-DQUEST_NARRATION_ENABLED=ON',
                "-DQUEST_DIAGNOSTIC_MODELS=${includeDiagnostics ? 'ON' : 'OFF'}",
                "-DMNN_SOURCE=${mnnSource.get().replace('\\', '/')}", "-DMNN_LIB=${mnnLib.get().replace('\\', '/')}" }
        }
    }
    externalNativeBuild { cmake { path '../../native/rvm/CMakeLists.txt'; version '3.31.6' } }
    // The Godot APK provides the matching NDK C++ shared runtime.
    packagingOptions { jniLibs {
        excludes += ['**/libc++_shared.so']
    } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

tasks.named('preBuild').configure { dependsOn stagePlayerAssets }

// Only SMB is used by the player. jcifs also ships deprecated HTTP NTLM wrappers
// that copy a caller-supplied TLS verifier when reconnecting. Bundle a filtered
// local jar so the Godot export cannot reintroduce these unused adapters.
configurations {
    smbUpstream { canBeConsumed = false; transitive = false }
    japaneseReadingUpstream { canBeConsumed = false; transitive = true }
    subtitleCharsetUpstream { canBeConsumed = false; transitive = false }
}
// CharsetDetector is hidden in Android's ICU API. Bundle only ICU's self-contained
// detection classes (no Unicode data/converters); Java Charset performs decoding.
def subtitleCharsetJar = tasks.register('subtitleCharsetJar', Jar) {
    archiveFileName = 'icu-subtitle-charset-78.1.jar'
    destinationDirectory = layout.buildDirectory.dir('subtitle-charset')
    from({ zipTree(configurations.subtitleCharsetUpstream.singleFile) }) {
        include 'com/ibm/icu/text/Charset*.class'
    }
    from('../../third_party/icu-charset/LICENSE.txt') { into 'META-INF'; rename { 'ICU-LICENSE.txt' } }
    inputs.file('../../third_party/icu-charset/distribution.json')
    doFirst {
        def receipt = new groovy.json.JsonSlurper().parse(file('../../third_party/icu-charset/distribution.json'))
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(configurations.subtitleCharsetUpstream.singleFile.bytes).encodeHex().toString()
        if (actual != receipt.upstream_jar_sha256) { throw new GradleException('Subtitle charset detector digest differs.') }
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
// Embed the reader and dictionary together, as for the SMB client below. Keep
// upstream license/notice copies in third_party/kuromoji (staged as assets);
// duplicate META-INF notices from the two jars must not break the Godot export.
def japaneseReadingJar = tasks.register('japaneseReadingJar', Jar) {
    archiveFileName = 'kuromoji-ipadic-reader-0.9.0.jar'
    destinationDirectory = layout.buildDirectory.dir('japanese-reading')
    from({ configurations.japaneseReadingUpstream.collect { zipTree(it) } })
    exclude 'META-INF/**'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
def smbClientJar = tasks.register('smbClientJar', Jar) {
    archiveFileName = 'jcifs-3.0.4-smb-client.jar'
    destinationDirectory = layout.buildDirectory.dir('smb-client')
    from({ zipTree(configurations.smbUpstream.singleFile) })
    exclude 'org/codelibs/jcifs/smb/http/**', 'org/codelibs/jcifs/smb/https/**'
    exclude 'org/codelibs/jcifs/smb1/http/**', 'org/codelibs/jcifs/smb1/https/**'
    exclude 'META-INF/MANIFEST.MF'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def godotApi = providers.gradleProperty('godotAarPath')
if (!godotApi.isPresent() || !file(godotApi.get()).isFile()) {
    throw new GradleException('Pass -PgodotAarPath=<Godot 4.7.2 Android template AAR>. Run tools/Build-Player.ps1 to prepare it.')
}
dependencies {
    // The exported Godot APK supplies this library. Never package a second engine.
    compileOnly files(godotApi.get())
    compileOnly files("../../app/godot/addons/quest_player/bin/cloudcore.aar")
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation project(':web-browser')
    // Explicit socket cancellation for shared cloud-media seek/pre-read handoff.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation('io.github.junkfood02.youtubedl-android:library:0.18.1') {
        // Extraction uses no Activity UI; Godot supplies its own matching Fragment runtime.
        exclude group: 'androidx.appcompat', module: 'appcompat'
    }
    // Offline Japanese readings for comic/subtitle speech; pin the matching dictionary.
    japaneseReadingUpstream 'com.atilika.kuromoji:kuromoji-ipadic:0.9.0'
    implementation files(japaneseReadingJar)
    // Preserve SMB2/3, NTLM authentication, signing and encryption (LGPL-2.1).
    smbUpstream 'org.codelibs:jcifs:3.0.4'
    implementation files(smbClientJar)
    // Match jcifs 3.0.4's upstream runtime dependencies; exported by Godot too.
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'
    testImplementation 'junit:junit:4.13.2'
    subtitleCharsetUpstream 'com.ibm.icu:icu4j:78.1'
    implementation files(subtitleCharsetJar)
    // JVM tests exercise org.json; android.jar only provides stubs.
    testImplementation 'org.json:json:20240303'
    // Debug Activity subclasses GodotActivity. The matching Godot export template
    // supplies Fragment 1.8.6; compile only, never package another host framework.
    debugCompileOnly 'androidx.fragment:fragment:1.8.6'
}

